 if(edge){let e=outlineGeos.get('box');if(!e){e=new T.EdgesGeometry(unitBox);outlineGeos.set('box',e);}o.add(new T.LineSegments(e,outlineMat));}

function canvasTexture(w,h,paint){const c=document.createElement('canvas');c.width=w;c.height=h;paint(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}

 return canvasTexture(w,h,(c)=>{c.fillStyle=bg;c.fillRect(0,0,w,h);lines.forEach((s,i)=>text(c,s,w/2,h*(i+.5)/lines.length,Math.min(h/lines.length*.66,w/(s.length*.59)),fg));});

 }

}

<script>
function showFailure(message){
  const e=document.getElementById('error');e.textContent=message;e.hidden=false;
  document.getElementById('world').hidden=true;
}
function startScene(){
  try{
    const source=document.getElementById('scene-source').textContent;
    const script=document.createElement('script');script.textContent=source;
    document.body.appendChild(script);
  }catch(e){console.error(e);showFailure('场景未能启动。请在支持 WebGL 的浏览器中打开，并启用硬件加速。\n'+String(e.message||e));}
}
window.addEventListener('error',e=>{
  if(e.message&&document.documentElement.dataset.ready!=='true'){
    showFailure('场景未能启动。请检查浏览器的 WebGL / 硬件加速设置。\n'+e.message);
  }
});

const engineURLs=["https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js", "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js", "https://raw.githubusercontent.com/mrdoob/three.js/r160/build/three.min.js"];
let attempt=0,started=false;
function loadEngine(){
  if(started)return;
  if(window.THREE){started=true;startScene();return;}
  if(attempt>=engineURLs.length){
    showFailure('无法加载 Three.js 引擎。此版本需要联网。\n请检查网络或浏览器是否阻止了外部脚本，然后重新打开此文件。');return;
  }
  const script=document.createElement('script');let settled=false;
  const next=()=>{if(settled||started)return;settled=true;clearTimeout(timer);script.remove();loadEngine();};
  script.src=engineURLs[attempt++];script.crossOrigin='anonymous';
  script.onload=()=>{if(settled||started)return;settled=true;clearTimeout(timer);if(window.THREE){started=true;startScene();}else loadEngine();};
  script.onerror=next;
  const timer=setTimeout(next,12000);
  document.head.appendChild(script);
}
loadEngine();
</script>
